name: Build e Release

# Monta o programa para Windows e macOS e publica o release com os dois.
#
#   Testar sem publicar:  aba Actions > "Build e Release" > Run workflow
#   Publicar um release:  git tag v1.0 && git push --tags
#
# Os binários do macOS são montados em máquinas Apple de verdade do GitHub,
# porque nenhum empacotador Python faz compilação cruzada.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ----------------------------------------------------------------- macOS
  # Só Apple Silicon. O runner macos-13 (Intel) não recebe mais máquina - foi
  # aposentado pela GitHub -, e um job eternamente na fila trava o release,
  # que espera por ele. Para Macs Intel, rode build_mac.sh num Mac Intel.
  macos:
    name: macOS - Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pillow

      - name: Instalar o ffmpeg
        run: |
          brew install ffmpeg
          echo "ffmpeg em: $(which ffmpeg)"
          ffmpeg -version | head -n 1

      - name: Gerar os ícones
        run: python make_icon.py

      - name: Empacotar o .app
        run: |
          pyinstaller --noconfirm --clean \
            --name "Tiktok Live Recorder" \
            --windowed \
            --icon assets/icon.icns \
            --osx-bundle-identifier com.tiktoklive.recorder \
            --add-data "assets:assets" \
            --add-binary "$(which ffmpeg):." \
            --exclude-module PIL \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module pytest \
            app.py

      # Esta etapa existe porque o app precisa rodar em QUALQUER Mac, não só
      # neste runner. O ffmpeg do Homebrew depende de bibliotecas instaladas
      # fora do pacote; o PyInstaller costuma copiá-las para dentro e reescrever
      # os caminhos, mas isso tem que ser conferido, nunca presumido.
      - name: Conferir que o app é autossuficiente
        run: |
          set -euo pipefail
          APP="dist/Tiktok Live Recorder.app"

          if [ ! -d "$APP" ]; then
            echo "::error::o .app não foi gerado"
            exit 1
          fi

          FF="$(find "$APP" -name 'ffmpeg' -type f -perm +111 | head -n 1)"
          if [ -z "$FF" ]; then
            echo "::error::o ffmpeg não foi embutido no pacote"
            exit 1
          fi
          echo "ffmpeg embutido em: ${FF#"$APP"/}"

          echo "--- dependências do ffmpeg embutido ---"
          otool -L "$FF" | tail -n +2

          FORA="$(otool -L "$FF" | tail -n +2 | grep -E '/opt/homebrew|/usr/local' || true)"
          if [ -n "$FORA" ]; then
            echo "::error::o ffmpeg embutido ainda aponta para bibliotecas de fora do pacote."
            echo "$FORA"
            echo "Solução: use um ffmpeg estático em vez do Homebrew."
            exit 1
          fi

          echo "--- executando o ffmpeg do pacote com ambiente limpo ---"
          env -i "$FF" -version | head -n 1
          echo "OK: o ffmpeg do pacote roda por conta própria"

      - name: Conferir que o app abre
        run: |
          set -euo pipefail
          BIN="dist/Tiktok Live Recorder.app/Contents/MacOS/Tiktok Live Recorder"
          test -x "$BIN" || { echo "::error::executável principal ausente"; exit 1; }

          # Sem tela no runner a interface não sobe, mas o processo tem que
          # sobreviver aos primeiros segundos sem estourar erro de importação.
          "$BIN" & PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: continuou de pé por 12s"
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID" && CODE=0 || CODE=$?
            echo "o processo encerrou com código $CODE (sem display no runner)"
          fi

      - name: Compactar
        run: |
          cd dist
          ditto -c -k --keepParent "Tiktok Live Recorder.app" "TikTokLiveRecorder.zip"
          ls -lh *.zip

      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/TikTokLiveRecorder.zip
          if-no-files-found: error

  # --------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pillow python-mpv TikTokLive

      # A libmpv nao e versionada (117 MB). Sem ela o build para: o editor
      # ficaria sem previa e nao ha por que publicar um executavel manco.
      # O nome do pacote carrega data e hash do commit, entao a URL nao pode
      # ser fixa - e resolvida pelo release mais recente.
      - name: Baixar a libmpv
        shell: pwsh
        run: |
          $api = "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $rel = Invoke-RestMethod -Uri $api -Headers @{
            "User-Agent"    = "tiktok-live-recorder-build"
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          }
          # x86_64 simples, nao o -v3: aquele exige AVX2 e nao abriria em
          # maquina mais antiga.
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "pacote mpv-dev x86_64 nao encontrado no release $($rel.tag_name)" }
          Write-Host "baixando $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv_dl | Out-Null
          $dll = Get-ChildItem -Path mpv_dl -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll nao veio no pacote" }
          New-Item -ItemType Directory -Force mpvlib | Out-Null
          Copy-Item $dll.FullName mpvlib\libmpv-2.dll
          "libmpv: {0:N0} MB" -f ((Get-Item mpvlib\libmpv-2.dll).Length / 1MB)

      # Build estático oficial do projeto BtbN: um .exe sem dependências.
      - name: Baixar o ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $ff = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe não encontrado no pacote baixado" }
          echo $ff.DirectoryName >> $env:GITHUB_PATH
          & $ff.FullName -version | Select-Object -First 1

      - name: Empacotar o .exe
        shell: pwsh
        run: python build_windows.py

      - name: Conferir o executável
        shell: pwsh
        run: |
          $exe = "dist\Tiktok Live Recorder.exe"
          if (-not (Test-Path $exe)) { throw "o .exe não foi gerado" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "gerado: $exe ($mb MB)"
          if ($mb -lt 20) { throw "o .exe saiu pequeno demais ($mb MB) - o ffmpeg provavelmente não entrou" }
          Copy-Item $exe "dist\TikTokLiveRecorder.exe"

      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: dist/TikTokLiveRecorder.exe
          if-no-files-found: error

  # --------------------------------------------------------------- Release
  release:
    name: Publicar release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Recolher os binários
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Listar o que veio
        run: find artefatos -type f | sort

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSAO="${GITHUB_REF_NAME}"

          cat > notas.md <<'EOF'
          Grava suas lives do TikTok em MP4 automaticamente, sem pesar no computador —
          e devolve no vídeo o **chat** e as **animações de presente**, que o replay
          oficial do TikTok não tem.

          ## O que tem de novo na 1.3

          - **Recortar qualquer vídeo.** A aba Editar deixou de exigir um pacote de
            presentes para exportar. Abra o arquivo que for — um replay baixado de
            outro lugar, um vídeo que nunca passou pelo gravador, um que não tem
            nada a ver com live —, marque início e fim e exporte. Antes o botão
            respondia "Falta o pacote" e não havia como recortar.
          - **O botão diz o que vai sair.** Sem nada para compor por cima, ele lê
            **Exportar trecho do vídeo** e o nome sugerido termina em `_trecho`;
            havendo animação, chat ou contador, volta a ser **Exportar vídeo com as
            camadas** e `_com_presentes`. A sincronia do áudio e o volume continuam
            valendo dos dois jeitos.

          As camadas seguem dependendo do registro da live — é dele que saem o chat,
          o contador e as animações. O corte é que não depende de nada.

          O chat desenhado é uma reconstrução — fica muito parecido, não idêntico.
          Emotes próprios da live e selos do apelido só aparecem em gravações novas.

          ## Baixar

          - **`TikTokLiveRecorder.exe`** (versão para **Windows** 10 e 11, 64 bits)
          - **`TikTokLiveRecorder.zip`** (versão para **macOS**, Macs com Apple Silicon — M1, M2, M3, M4)

          Não precisa instalar nada: nem Python, nem ffmpeg. O ffmpeg vai embutido.

          *Mac com processador Intel:* a GitHub aposentou as máquinas Intel, então
          não há como gerar esse binário automaticamente. Se precisar, rode
          `build_mac.sh` num Mac Intel — o script faz o pacote localmente.

          ## Primeira abertura

          **Windows:** o SmartScreen pode avisar que o programa é desconhecido
          (não tem assinatura paga). Clique em *Mais informações* > *Executar assim mesmo*.

          **macOS:** clique com o **botão direito** no app > *Abrir* > *Abrir*.
          Só na primeira vez.

          ## Como usar

          1. Digite seu `@`
          2. Clique em **● Iniciar Gravação**

          Pode armar antes de começar a transmitir: ele detecta a live e grava sozinho.
          Quando ela acaba, salva o MP4 e volta a esperar a próxima.

          Grava na qualidade `origin` do TikTok — seu vídeo original, sem recompressão,
          na resolução e taxa de quadros que você transmitiu.
          EOF

          # Refazer uma tag (git tag -f) tem que substituir o release, não
          # esbarrar num "already exists" e perder o build inteiro.
          if gh release view "$VERSAO" >/dev/null 2>&1; then
            echo "release $VERSAO já existe - substituindo"
            gh release delete "$VERSAO" --yes
          fi

          WIN="artefatos/build-windows/TikTokLiveRecorder.exe"
          MAC="artefatos/build-macos/TikTokLiveRecorder.zip"
          for f in "$WIN" "$MAC"; do
            if [ ! -f "$f" ]; then
              echo "::error::binário esperado não veio dos builds: $f"
              exit 1
            fi
          done

          # O texto após o "#" vira o rótulo do asset: é o que a lista de
          # Assets exibe, enquanto o arquivo baixado mantém o nome limpo.
          gh release create "$VERSAO" \
            --title "Tiktok Live Recorder $VERSAO" \
            --notes-file notas.md \
            "$WIN#TikTokLiveRecorder.exe (Windows 10/11, 64 bits)" \
            "$MAC#TikTokLiveRecorder.zip (macOS, Apple Silicon)"
